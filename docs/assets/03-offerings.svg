  <text x="720" y="284" font-size="12" fill="#e6edf3">$0.05</text>
  <rect x="792" y="273" width="208" height="14" rx="4" fill="#6fb7d9"/>
  <text x="1012" y="284" font-size="12" fill="#8b949e">26</text>

  <text x="720" y="312" font-size="12" fill="#e6edf3">$0.10</text>
  <rect x="792" y="301" width="24" height="14" rx="4" fill="#6fb7d9" opacity="0.4"/>
  <text x="828" y="312" font-size="12" fill="#8b949e">3</text>

  <text x="720" y="348" font-size="11" fill="#566070">SLA window 30 to 240 min · each entry</text>
  <text x="720" y="366" font-size="11" fill="#566070">carries its own acp_id</text>

  <rect x="40" y="398" width="1020" height="42" rx="10" fill="#161b22" stroke="#6fb7d9" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="64" cy="419" r="4" fill="#6fb7d9"/>
  <text x="82" y="424" font-size="12" fill="#c9d1d9">as a client, MATRIX matches offerings in: code · bug · sql · regex · test · scaffold · defi · build</text>

  <text x="550" y="466" text-anchor="middle" font-size="13" fill="#8b949e">one engine, many SKUs — build the capability once, sell quick, standard and deep tiers</text>
