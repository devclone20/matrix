  <rect x="228" y="194" width="340" height="16" rx="4" fill="#6fb7d9"/>
  <text x="582" y="207" font-size="12" fill="#8b949e">10</text>

  <text x="64" y="243" font-size="12" fill="#c9d1d9">3 · Wallet &amp; Crypto</text>
  <rect x="228" y="230" width="204" height="16" rx="4" fill="#6fb7d9" opacity="0.72"/>
  <text x="446" y="243" font-size="12" fill="#8b949e">6</text>

  <text x="64" y="279" font-size="12" fill="#c9d1d9">4 · Content &amp; Social</text>
