  <text x="378" y="279" font-size="12" fill="#8b949e">4</text>

  <text x="64" y="315" font-size="12" fill="#c9d1d9">5 · Agent Platform</text>
  <rect x="228" y="302" width="204" height="16" rx="4" fill="#6fb7d9" opacity="0.72"/>
  <text x="446" y="315" font-size="12" fill="#8b949e">6</text>

  <text x="64" y="356" font-size="11" fill="#566070">offerings per engine, counted from the categories in skills/acp_skill.py</text>

  <!-- catalogue -->
