  <text x="64" y="136" font-size="11" fill="#566070">execution_engine.py routes every offering_id to a method</text>

  <text x="64" y="171" font-size="12" fill="#c9d1d9">1 · Research &amp; Data</text>
  <rect x="228" y="158" width="204" height="16" rx="4" fill="#6fb7d9" opacity="0.72"/>
  <text x="446" y="171" font-size="12" fill="#8b949e">6</text>

