<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <defs>
    <linearGradient id="accentline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6fb7d9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6fb7d9" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="480" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="1097" height="477" rx="13" fill="none" stroke="#30363d" stroke-width="3"/>
  <rect x="0" y="472" width="1100" height="4" fill="url(#accentline)" opacity="0.9"/>

  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>

  <g stroke="#6fb7d9" fill="none" stroke-width="1.6" stroke-linecap="round">
    <rect x="101" y="15.5" width="20" height="17" rx="6"/>
    <line x1="111" y1="15.5" x2="111" y2="11.5"/>
  </g>
  <circle cx="111" cy="10" r="1.6" fill="#6fb7d9"/>
  <circle cx="106.8" cy="22" r="1.7" fill="#6fb7d9"/>
  <circle cx="115.2" cy="22" r="1.7" fill="#6fb7d9"/>
  <path d="M107 27 Q111 30 115 27" stroke="#6fb7d9" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <text x="550" y="31" text-anchor="middle" font-size="13" fill="#8b949e">how it runs — the processes, who keeps them alive, and where the state lands</text>

  <!-- processes -->
  <rect x="40" y="84" width="331" height="276" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="64" y="114" font-size="14" font-weight="700" fill="#6fb7d9">Processes</text>

  <text x="64" y="150" font-size="12" fill="#c9d1d9">server.py</text>
  <text x="64" y="168" font-size="11" fill="#566070">acp provider loop · 5s poll</text>

  <text x="64" y="198" font-size="12" fill="#c9d1d9">ops/bootstrapper.py</text>
  <text x="64" y="216" font-size="11" fill="#566070">client agents · 8s poll</text>

  <text x="64" y="246" font-size="12" fill="#c9d1d9">ops/watchdog.py</text>
  <text x="64" y="264" font-size="11" fill="#566070">restarts a dead server</text>

  <text x="64" y="294" font-size="12" fill="#c9d1d9">training/scheduler.py</text>
  <text x="64" y="312" font-size="11" fill="#566070">7 modules · 07:00 + 19:00 UTC</text>

  <text x="64" y="342" font-size="12" fill="#c9d1d9">ops/daily_report.py</text>

  <!-- supervision -->
  <rect x="384" y="84" width="331" height="276" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="408" y="114" font-size="14" font-weight="700" fill="#b18bf5">Supervision</text>

  <text x="408" y="150" font-size="12" fill="#c9d1d9">systemd — 5 units</text>
  <text x="408" y="168" font-size="11" fill="#566070">linux · Restart=on-failure</text>

  <text x="408" y="198" font-size="12" fill="#c9d1d9">launchd — 6 jobs</text>
  <text x="408" y="216" font-size="11" fill="#566070">macOS · KeepAlive</text>

  <text x="408" y="246" font-size="12" fill="#c9d1d9">logrotate conf</text>
  <text x="408" y="264" font-size="11" fill="#566070">/var/log/iclone</text>

  <text x="408" y="294" font-size="12" fill="#c9d1d9">ops/do/</text>
  <text x="408" y="312" font-size="11" fill="#566070">5 deploy scripts · Ubuntu 22.04</text>

  <text x="408" y="342" font-size="12" fill="#c9d1d9">start.sh — preflight checks</text>

  <!-- state -->
  <rect x="728" y="84" width="331" height="276" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="752" y="114" font-size="14" font-weight="700" fill="#f0a14a">State</text>

  <text x="752" y="150" font-size="12" fill="#c9d1d9">Supabase</text>
  <text x="752" y="168" font-size="11" fill="#566070">fire-and-forget writes</text>

  <text x="752" y="198" font-size="12" fill="#c9d1d9">acp_jobs</text>
  <text x="752" y="216" font-size="11" fill="#566070">every job state transition</text>

  <text x="752" y="246" font-size="12" fill="#c9d1d9">latest_state</text>
  <text x="752" y="264" font-size="11" fill="#566070">single-row runtime upsert</text>

  <text x="752" y="294" font-size="12" fill="#c9d1d9">self_attendance</text>
  <text x="752" y="312" font-size="11" fill="#566070">cron self-evaluation scores</text>

  <text x="752" y="342" font-size="12" fill="#c9d1d9">sql migrations · 001 + 002</text>

  <!-- matrix's own unit -->
  <rect x="40" y="376" width="1020" height="64" rx="10" fill="#161b22" stroke="#6fb7d9" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="64" cy="400" r="4" fill="#6fb7d9"/>
  <text x="82" y="405" font-size="12" fill="#c9d1d9">MATRIX has its own unit — iclone-matrix.service · com.iclone.matrix.plist</text>
  <text x="82" y="427" font-size="11" fill="#8b949e">ops/bootstrapper.py --agent matrix · daily budget $10 · max job price $0.10 · 10 jobs/hour</text>

  <text x="550" y="460" text-anchor="middle" font-size="13" fill="#8b949e">same programs, two supervisors — launchd on macOS, systemd on the droplet</text>
</svg>
